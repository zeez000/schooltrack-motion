name: Verify and publish SchoolTrack
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "schooltrack-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: schooltrack_test
          POSTGRES_USER: schooltrack
          POSTGRES_PASSWORD: schooltrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schooltrack -d schooltrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://schooltrack:schooltrack_test@127.0.0.1:5432/schooltrack_test?schema=public
      JWT_ACCESS_SECRET: github-actions-schooltrack-test-secret-1234567890
      NODE_ENV: test
      LOG_LEVEL: silent
      POSTGRES_DB: schooltrack_test
      POSTGRES_USER: schooltrack
      POSTGRES_PASSWORD: schooltrack_test
      DOMAIN: api.schooltrack.test
      CORS_ORIGINS: https://schooltrack.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend
        run: npm ci --prefix backend
      - name: Install frontend browser test dependencies
        run: npm ci && npx playwright install --with-deps chromium
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high && npm --prefix backend audit --omit=dev --audit-level=high
      - name: Frontend API and role scripts parse
        run: |
          for source in site/config.js site/real.js site/api/*.js; do node --check "$source"; done
      - name: Verify committed Prisma migrations exist
        run: |
          test -s backend/prisma/migrations/202609270001_full_backend/migration.sql
          test -s backend/prisma/migrations/202609300001_device_capabilities/migration.sql
      - name: Apply migrations
        run: npm --prefix backend run db:migrate:deploy
      - name: Verify primary-to-security migration upgrade
        env:
          PGPASSWORD: schooltrack_test
        run: |
          createdb -h 127.0.0.1 -U schooltrack schooltrack_upgrade
          psql -h 127.0.0.1 -U schooltrack -d schooltrack_upgrade -v ON_ERROR_STOP=1 -f backend/prisma/migrations/202609270001_full_backend/migration.sql
          psql -h 127.0.0.1 -U schooltrack -d schooltrack_upgrade -v ON_ERROR_STOP=1 -f backend/prisma/migrations/202609300001_device_capabilities/migration.sql
          psql -h 127.0.0.1 -U schooltrack -d schooltrack_upgrade -v ON_ERROR_STOP=1 -c 'SELECT "allowedEventTypes", "vehicleId" FROM "Device" LIMIT 0'
      - name: Verify fictional demo seed
        run: npm --prefix backend run db:seed
      - name: Backend tests
        run: npm run test:backend
      - name: Backend typecheck
        run: npm --prefix backend run typecheck
      - name: Backend build
        run: npm run build:backend
      - name: Backend Docker build
        run: docker build -t schooltrack-backend-ci ./backend
      - name: Validate local Compose
        run: docker compose -f docker-compose.yml config >/dev/null
      - name: Validate production Compose
        run: docker compose -f docker-compose.prod.yml config >/dev/null
      - name: Frontend tests
        run: npm test
      - name: Frontend build
        run: npm run build
        env:
          SCHOOLTRACK_API_BASE_URL: ${{ vars.SCHOOLTRACK_API_BASE_URL }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing browser regression tests
        run: pip install playwright==1.63.0 && python tests/browser_test.py
      - name: Browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
