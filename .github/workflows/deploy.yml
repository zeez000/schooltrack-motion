name: Verify and publish SchoolTrack
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: schooltrack_test
          POSTGRES_USER: schooltrack
          POSTGRES_PASSWORD: schooltrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schooltrack -d schooltrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://schooltrack:schooltrack_test@127.0.0.1:5432/schooltrack_test?schema=public
      JWT_ACCESS_SECRET: github-actions-schooltrack-test-secret-1234567890
      NODE_ENV: test
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend
        run: npm ci --prefix backend
      - name: Verify committed Prisma migration exists
        run: test -s backend/prisma/migrations/202609270001_full_backend/migration.sql
      - name: Apply migrations
        run: npm --prefix backend run db:migrate:deploy
      - name: Backend tests
        run: npm run test:backend
      - name: Backend typecheck
        run: npm --prefix backend run typecheck
      - name: Backend build
        run: npm run build:backend
      - name: Frontend tests
        run: npm test
      - name: Frontend build
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
